      allOf:
        - $ref: '#/components/schemas/Reference'
    TrainingTypeReference:
      description: >-
        Training type reference
        (see https://api.reliefweb.int/v2/references/training-types)
      allOf:
        - $ref: '#/components/schemas/Reference'
    VulnerableGroupReference:
      description: >-
        Vulnerable group reference
        (see https://api.reliefweb.int/v2/references/vulnerable-groups)
      allOf:
        - $ref: '#/components/schemas/Reference'
    # Content resources
    Report:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdField'
        fields:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/IdField'
            uuid:
              $ref: '#/components/schemas/UuidField'
            url:
              $ref: '#/components/schemas/UrlField'
            url_alias:
              $ref: '#/components/schemas/UrlAliasField'
            redirects:
              $ref: '#/components/schemas/RedirectsField'
            status:
              type: string
              description: Publication status of the report
              enum:
                - published
            date:
              allOf:
                - $ref: '#/components/schemas/DateField'
                - type: object
                  properties:
                    original:
                      type: string
                      format: date-time
                      description: Original publication date
                  required:
                    - original
            origin:
              type: string
              format: url
              description: Origin of the document
            title:
              type: string
              description: Title of the report
            language:
              type: array
              description: Language(s) of the document and its attachments
              items:
                $ref: '#/components/schemas/LanguageReference'
              minItems: 1
            body:
              type: string
              format: markdown
              description: Content of the report in Markdown format
            body-html:
              type: string
              format: html
              description: Content of the report in HTML format
            headline:
              type: object
              description: >-
                Headline information if the document has been marked as headline
              properties:
