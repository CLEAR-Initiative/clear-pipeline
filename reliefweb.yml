    # Resource Definitions
    File:
      type: object
      properties:
        id:
          type: integer
          description: Internal use
        url:
          type: string
          format: url
          description: URL to raw image
        filename:
          type: string
          description: File name
        filesize:
          type: string
          description: File size in Bytes
        mimetype:
          type: string
          description: 'Mime-type (example: image/png)'
        description:
          type: string
          description: Description of the attachment
        preview:
          type: object
          description: Cover preview
          properties:
            url:
              type: string
              format: url
              description: URL to raw image
            url-thumb:
              type: string
              format: url
              description: >-
                URL to image in thumbnail format (max width: 220px,
                max height: 140px)
            url-small:
              type: string
              format: url
              description: >-
                URL to image with small size (width: 200px, height:
                variable)
            url-large:
              type: string
              format: url
              description: >-
                URL to image with large size (width: 680px, height:
                variable)
      required:
        - id
        - url
        - filename
        - filesize
        - mimetype
    Image:
      type: object
      properties:
        id:
          type: integer
          description: Internal use
        url:
          type: string
          format: url
          description: URL to raw image
        url-thumb:
          type: string
          format: url
          description: 'URL to image in thumbnail format (max width: 220px, max height: 140px)'
        url-small:
          type: string
          format: url
          description: 'URL to image with small size (width: 200px, height: variable)'
        url-large:
          type: string
          format: url
          description: 'URL to image with large size (width: 680px, height: variable)'
        width:
          type: integer
          description: width of the raw image
        height:
          type: integer
          description: height of the raw image
        filename:
          type: string
          description: File name
        filesize:
          type: string
          description: File size in Bytes
        mimetype:
          type: string
          description: 'Mime-type (example: image/png)'
        copyright:
          type: string
          description: Image copyright information
        caption:
          type: string
          description: Image caption
      required:
        - id
        - url
        - url-thumb
        - url-small
        - url-large
        - width
        - height
        - filename
        - filesize
        - mimetype
        - copyright
        - caption
    Location:
      type: object
      description: Centroid coordinates
      properties:
        lat:
          type: number
        lon:
          type: number
    ProfileReliefWebLink:
      type: object
      properties:
        title:
          type: string
          description: Document title
        url:
          type: string
          format: url
          description: URL to the document on the ReliefWeb website
        cover:
          type: string
          format: url
          description: URL to the cover preview of the document PDF if any
      required:
        - title
        - url
    ProfileExternalLink:
      type: object
      properties:
        title:
          type: string
          description: External link title
        url:
          type: string
          format: url
          description: Link URL outside of the ReliefWeb website
        logo:
          type: string
          format: url
          description: External link logo url
      required:
        - title
        - url
    Profile:
      type: object
      properties:
        overview:
          type: string
          format: markdown
          description: Description/overview in markdown format
        overview-html:
          type: string
          format: html
          description: Description/overview in HTML format
        appeals_response_plans:
          type: object
          properties:
            title:
              type: string
              description: English title of the profile section
              pattern: /^Appeals & Response Plans$/
            active:
              type: array
              description: >-
                List of links to the active appeals and response plans
              items:
                $ref: '#/components/schemas/ProfileReliefWebLink'
            archive:
              type: array
              description: Archive of links to older appeals and response plans
              items:
                $ref: '#/components/schemas/ProfileReliefWebLink'
          required:
            - title
            - active
        key_content:
          type: object
          properties:
            title:
              type: string
              description: English title of the profile section
              pattern: /^Key Content$/
            active:
              type: array
              description: List of links to the active key content
              items:
                $ref: '#/components/schemas/ProfileReliefWebLink'
            archive:
              type: array
              description: Archive of links to older key content
              items:
                $ref: '#/components/schemas/ProfileReliefWebLink'
          required:
            - title
            - active
        useful_links:
          type: object
          properties:
            title:
              type: string
              description: English title of the profile section
              pattern: /^Useful Links$/
            active:
              type: array
              description: List of useful links
              items:
                $ref: '#/components/schemas/ProfileExternalLink'
          required:
            - title
            - active
    RiverSearch:
      type: object
      description: A URL to a river (list of documents) on ReliefWeb
      properties:
        id:
          type: string
          description: ID of the river search URL
        title:
          type: string
          description: Title for the river search URL
        url:
          type: string
          format: url
          description: URL of the river search URL on the ReliefWeb website
        override:
          type: integer
          description: ID of an highlighted resource for the river
      required:
        - id
        - title
        - url
    IdField:
      type: integer
      description: ID of the resource
    UuidField:
      type: string
      format: uuid
      description: UUID of the resource
    UrlField:
      type: string
      format: url
      description: >-
        URL of the resource on the ReliefWeb website - permanent url
    UrlAliasField:
      type: string
      format: url
      description: >-
        URL of the resource on the ReliefWeb website - canonical url
    RedirectsField:
      type: array
      description: >-
        Legacy URLs of the resource on the ReliefWeb website
      items:
        type: string
        format: url
    DateField:
      type: object
      description: Dates associated with a resource
      properties:
        created:
          type: string
          format: date-time
          description: Creation date on ReliefWeb
        changed:
          type: string
          format: date-time
          description: Date of the latest change
      required:
        - created
        - changed
    CityField:
      type: object
      description: >-
        List of cities
      properties:
        name:
          type: string
          description: City name
      required:
        - name
    # References
    Reference:
      description: >-
        Term reference
        (see https://api.reliefweb.int/v2/references)
      type: object
      properties:
        id:
          type: integer
          description: ID of the reference resource
        name:
