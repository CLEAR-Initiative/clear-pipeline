openapi: 3.1.0
info:
  title: ReliefWeb API - OpenAPI 3.1
  description: >-
    This is the swagger UI for the OpenAPI definition of the ReliefWeb API.

    #### Objet parameter serialization

    Some query parameters like `query` or `filter` are nested objects which are
    serialized in the form `root[property][subproperty]=value`.

    For example the following `query` parameter:

    <code><pre>{
      "value": "Situation Report",
      "fields": ["title", "body"]
    }</code></pre>

    is serialized as

    `query[value]=Situation+Report&fields[0]=title&fields[1]=body`
    <br><br>
    The definitions of those parameters have a `x-reliefweb-api-serialization`
    custom property to help identify them.
  version: 2.0.0
servers:
