      description: List of vulnerable groups or single vulnerable group
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVulnerableGroupReferences'
  schemas:
    # Requests
    PostRequestPayload:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/QueryParameter'
        filter:
          $ref: '#/components/schemas/FilterParameter'
        facets:
          $ref: '#/components/schemas/FacetsParameter'
        limit:
          $ref: '#/components/schemas/LimitParameter'
        offset:
          $ref: '#/components/schemas/OffsetParameter'
        sort:
          $ref: '#/components/schemas/SortParameter'
        profile:
          $ref: '#/components/schemas/ProfileParameter'
        preset:
          $ref: '#/components/schemas/PresetParameter'
        fields:
          $ref: '#/components/schemas/FieldsParameter'
    # Parameters
    AppnameParameter:
      description: Name of the application or URL of website using the API
      type: string
    QueryParameter:
      description: Full text search query
      type: object
      properties:
        value:
          type: string
          description: Text to search for
        fields:
          type: array
          description: >-
            List of fields to query on
            See the schema of the resource for the available fields
          items:
            type: string
        operator:
          type: string
          description: >-
            Default conjunction between words in the search query
            Defaults to `OR`
          enum:
            - AND
            - OR
    FilterParameter:
      description: Condition(s) to filter the list of resources
      allOf:
        - type: object
        - $ref: '#/components/schemas/Filter'
    FacetsParameter:
      description: Aggregate information about the resources
      type: array
      items:
        $ref: '#/components/schemas/Facet'
    LimitParameter:
      description: Number of resources to return. Max 1000
      type: integer
      minimum: 0
      maximum: 1000
    OffsetParameter:
      description: >-
        Number of resources to skip. Used for paging through the results
      type: integer
      minimum: 0
    SortParameter:
      description: >-
        How to order the resources in the form `field:order` where `field` is
        a sortable field of the resource and `order` is the direction: `desc`
        or `asc`. Several fields can be used with the first having higher
        priority for the ordering. Without a `sort` parameter, the results
        are order by `relevance` (special `score` field, ex: "score:desc"). If
        there is no sort specified, results may not be consistent
      type: array
      items:
        type: string
    ProfileParameter:
      description: >-
        A shorthand specification for which sets of fields to include in result

        - `minimal`: just the `title` or `name` of the resource (default)
        - `full`: all the resource fields
        - `list`: set of fields used to produce lists like https://reliefweb.int/updates
        - `suggest`: only for references, countries, disasters and sources,
          to have relevant fields for autocomplete suggestion purposes (name etc.)
      type: string
      enum:
        - minimal
        - full
        - list
        - suggest
    PresetParameter:
      description: >-
        A shorthand specification for which sets of fields to include in result

        - `analysis`: include archived disasters and expired jobs and training
          which otherwise would be excluded from results. This is useful for
          visualizing trends and performing analysis of past content
        - `full`: sorts by date for appropriate content types. Countries and
          sources are sorted by `id`. Use this for `list` requests
        - `suggest`: only for references, countries, disasters and sources; sets
          the full text search mode to `suggestion` and limit fields to query;
          useful for autocomplete suggestions
          example
        - `minimal`: basic sensible status filters and default fields of the
          full text search queries
        - `default`: default sensible status filters for most requests
      type: string
      enum:
        - analysis
        - latest
        - suggest
        - minimal
        - default
    FieldsParameter:
      description: >-
        List of resource fields to include or exclude in the results
        Nested fields are expressed as `field.subfield.subsubfield`
      type: object
      properties:
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
    SlimParameter:
      description: >-
        Flag to reduce the reponse body by removing the hypermedia links
        Defaults to 0 (hypermedia links are present)
      type: integer
      enum:
        - 0
        - 1
    VerboseParameter:
      description: >-
        When set to `1`, a `details` section is added to the response body
        containing the query parameters as a JSON object. Useful to inspect
        the request and response. Defaults to 0 (not verbose)
      type: integer
      enum:
        - 0
        - 1
    ResourceIdParameter:
      description: The identifier of a resource
      oneOf:
        - $ref: '#/components/schemas/IdField'
        - $ref: '#/components/schemas/UuidField'
    ResourceUuidParameter:
      description: The UUID of a resource
      $ref: '#/components/schemas/UuidField'
    # Filter definitions
    FilterDateValue:
      type: string
      description: Date in the ISO-8601 format
      format: date
      example: '2022-11-17T05:13:54+00:00'
    FilterSingleValue:
      anyOf:
        - type: boolean
        - type: number
        - type: string
        - $ref: '#/components/schemas/FilterDateValue'
    FilterNumberRangeValue:
      type: object
      properties:
        from:
          type: number
          description: >-
            Lower bound of the range (will match higher than or equal values)
        to:
          type: number
          description: >-
            Higher bound of the range (will match lower than or equal values)
    FilterDateRangeValue:
      type: object
      properties:
        from:
          description: >-
            Lower bound of the range (will match higher than or equal values)
          allOf:
            - $ref: '#/components/schemas/FilterDateValue'
        to:
          description: >-
            Higher bound of the range (will match lower than or equal values)
          allOf:
            - $ref: '#/components/schemas/FilterDateValue'
    FilterArrayValue:
      type: array
      items:
        $ref: '#/components/schemas/FilterSingleValue'
    FilterRangeValue:
      oneOf:
        - $ref: '#/components/schemas/FilterDateRangeValue'
        - $ref: '#/components/schemas/FilterNumberRangeValue'
    FilterValue:
      oneOf:
        - $ref: '#/components/schemas/FilterArrayValue'
        - $ref: '#/components/schemas/FilterRangeValue'
        - $ref: '#/components/schemas/FilterSingleValue'
    FilterField:
      type: string
      description: >-
        Field to filter on
        See the list of fields for the resource
    FilterNegate:
      type: boolean
      description: Negate the filter (find resource not matching the filter)
    FilterOperator:
      type: string
      description: >-
        Conjunction (`AND` or `OR`) to combine the filter values or conditions
        Defaults to `OR`
      enum:
        - AND
        - OR
    ExistenceFilter:
      description: Match resources that have a value for the given field
      type: object
      properties:
        field:
          $ref: '#/components/schemas/FilterField'
        negate:
          $ref: '#/components/schemas/FilterNegate'
      required:
        - field
    SingleValueFilter:
      type: object
      description: Match resources having the given value
      properties:
        field:
          $ref: '#/components/schemas/FilterField'
        value:
          $ref: '#/components/schemas/FilterSingleValue'
        negate:
          $ref: '#/components/schemas/FilterNegate'
      required:
        - field
        - value
    ArrayValueFilter:
      type: object
      description: Match resources having all or any of the given values
      properties:
        field:
          $ref: '#/components/schemas/FilterField'
        value:
          $ref: '#/components/schemas/FilterArrayValue'
        negate:
          $ref: '#/components/schemas/FilterNegate'
        operator:
          $ref: '#/components/schemas/FilterOperator'
      required:
        - field
        - value
    RangeValueFilter:
      type: object
      description: Match resources having the given value
      properties:
        field:
          $ref: '#/components/schemas/FilterField'
        value:
          $ref: '#/components/schemas/FilterRangeValue'
        negate:
          $ref: '#/components/schemas/FilterNegate'
      required:
        - field
        - value
    ConditionListFilter:
      type: object
      description: Filter containing a list of other filters
      properties:
        conditions:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/ExistenceFilter'
              - $ref: '#/components/schemas/SingleValueFilter'
              - $ref: '#/components/schemas/ArrayValueFilter'
              - $ref: '#/components/schemas/RangeValueFilter'
        negate:
          $ref: '#/components/schemas/FilterNegate'
        operator:
          $ref: '#/components/schemas/FilterOperator'
      required:
        - conditions
    Filter:
      description: Filter or list of filters
      oneOf:
        - $ref: '#/components/schemas/ExistenceFilter'
        - $ref: '#/components/schemas/SingleValueFilter'
        - $ref: '#/components/schemas/ArrayValueFilter'
        - $ref: '#/components/schemas/RangeValueFilter'
        - $ref: '#/components/schemas/ConditionListFilter'
    # Facet definition
    Facet:
      type: object
      properties:
        field:
          type: string
          description: The field on which to perform the aggregation
        name:
          type: string
          description: An optional label to identify the facet
        limit:
          type: integer
          description: >-
            The maximum number of aggregated results to return
            Defaults to 10
        sort:
            type: string
            description: >-
              The sort order for **non-date** facets. Either sort number of
              aggregated results or the value of the aggregated field
              Defaults to `count:desc`
            enum:
              - value:asc
              - valie:desc
              - count:asc
              - count:desc
        filter:
          description: >-
            Additional filter(s) applied to the resources for the aggregated
            data of this facet
          allOf:
            - $ref: '#/components/schemas/Filter'
        interval:
          type: string
          description: >-
            For date facets. Breaks down by `year`, `month`, `week` or `day`
          enum:
            - year
            - month
            - week
            - day
        scope:
          type: string
          description: >-
            Refines how the main query and filters apply to the resources when
            aggregating data for the facet. It can be `global` in which case,
            the main full text search query and filters are ignored or `query`
            in which case only the main full text search query applies or
            `default` in which case both the main fill text search query and
            filters apply to determine the resources on which to perform the
            aggregation
          enum:
            - default
            - query
            - global
      required:
        - field
    # Result definitions
    ResultError:
      type: object
      properties:
        status:
          type: integer
          description: The status code
        time:
          type: integer
          description: The time it took to generate the response
        error:
          type: object
          description: The description of the error
          properties:
            type:
              type: string
              description: The error type
            message:
              type: string
              description: The error message
    ResultCommon:
      type: object
      properties:
        time:
          type: integer
          description: Total time it took to return the data
        href:
          type: string
          format: url
          description: Link to this resource
        links:
          type: object
          description: Hypermedia links
          properties:
            self:
              type: string
              format: url
              description: Link to this resource
            next:
              type: string
              format: url
              description: Link to the next page of this type of resource
            previous:
              type: string
              format: url
              description:  Link to the previous page of this type of resource
        took:
          type: integer
          description: Time it took to retrieve the data
        totalCount:
          type: integer
          description: Total number of resources
        count:
          type: integer
          description: Number of resources in this resultset
    ResultReports:
