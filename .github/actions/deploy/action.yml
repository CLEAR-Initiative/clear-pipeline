name: Deploy
description: Pull the latest clear-pipeline image on the Dagster VM and recreate the Dagster services in order

inputs:
  host:
    description: >-
      Dagster VM address. It has no public IP: this is its private IP,
      reached through jump-host.
    required: true
  jump-host:
    description: Public address of the env's app VM, used as the SSH jump host
    required: true
  ssh-key:
    description: SSH private key, authorised on both the app VM and the Dagster VM
    required: true
  registry-token:
    description: Token allowed to pull from the registry
    required: true

runs:
  using: composite
  steps:
    - name: SSH and roll the deployment
      uses: appleboy/ssh-action@v1
      env:
        GHCR_TOKEN: ${{ inputs.registry-token }}
      with:
        host: ${{ inputs.host }}
        username: ubuntu
        key: ${{ inputs.ssh-key }}
        proxy_host: ${{ inputs.jump-host }}
        proxy_username: ubuntu
        proxy_key: ${{ inputs.ssh-key }}
        envs: GHCR_TOKEN
        script: |
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd /srv/app
          docker compose pull dagster-code dagster-daemon dagster-webserver
          docker compose rm -f -s dagster-code
          docker compose up -d --force-recreate dagster-code
          docker compose rm -f -s dagster-daemon
          docker compose up -d --force-recreate dagster-daemon
          docker compose rm -f -s dagster-webserver
          docker compose up -d --force-recreate dagster-webserver
          docker image prune -a -f
          docker compose ps | grep -E 'dagster-'
