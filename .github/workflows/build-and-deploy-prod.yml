name: Tag, Build & deploy prod
# Mirrors build-and-deploy-dev.yml: a merge to `prod` tags a new version, builds
# the prod image, pushes it to GHCR, and rolls the Infomaniak prod VM. `prod`
# merges are gated by human review (no-automerge), so the merge itself is the
# deploy gate. `workflow_dispatch` also runs it from the `prod` branch.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create version tag
    # workflow_dispatch's branch filter is NOT restricted by `push.branches`, so
    # a manual run from any branch holding this file would otherwise publish that
    # branch's code as :prod. Only ever tag/build/deploy from the prod branch.
    # `build`/`deploy` need this job, so guarding it here gates the whole run.
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag next version (retry on a concurrent release)
        id: version
        run: |
          # dev and prod bump the SAME global MAJOR.MINOR.PATCH sequence from
          # separate concurrency groups, so two runs can compute the same next
          # version and one `git push` of the tag loses. Re-read the latest tag
          # and retry, so prod never silently skips its build/deploy on a lost
          # race (the old tag-ref gate is gone).
          for _ in $(seq 1 6); do
            LATEST=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            git tag "$VERSION" "$GITHUB_SHA"
            if git push origin "refs/tags/$VERSION"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "tag $VERSION already exists (concurrent release) — retrying"
            git tag -d "$VERSION" || true
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "::error::could not allocate a version tag after retries"
          exit 1

  build:
    name: Build & push image
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-image
        with:
          environment: prod
          version: ${{ needs.tag.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to prod
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.APP_VM_HOST }}
          ssh-key: ${{ secrets.APP_VM_SSH_KEY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
