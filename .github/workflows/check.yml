name: Check

# Tests + lint on every PR into dev, and on pushes to dev so a red dev is
# visible. Separate from release-dev.yml, which ships on push
# regardless — make this a required check in branch protection to gate
# merges on it.

on:
  pull_request:
    branches: [dev]
    # `edited` re-runs the check when the author fills in the PR description's
    # "Manual deploy steps" section.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]

# Cancel a superseded run only for pull_request events. Push-to-dev runs are
# the only verdict a merged commit ever gets (the release is not gated on CI),
# so merges landing back to back must not cancel each other. PR runs share a
# group per PR; push runs get a group per SHA, because GitHub also cancels a
# *pending* run in a group when a third run arrives, regardless of
# cancel-in-progress.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A step the code needs but no code performs must be written down with a
      # prod checkbox and a ticket, or the PR says "None" (clear #1524). Bot PRs
      # are exempt.
      - name: Manual deploy steps section is filled in
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --test .github/scripts/check-manual-deploy-steps.test.mjs
          node .github/scripts/check-manual-deploy-steps.mjs

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches the Dockerfile's python:3.12-slim
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff, pinned)
        run: uvx ruff@0.16.9 check src tests

      - name: Test
        run: uv run --frozen pytest -q
