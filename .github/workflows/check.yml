name: Check

# Tests + lint on every PR into dev or prod, and on pushes to dev so a red dev
# is visible. Separate from release-dev.yml, which ships on push
# regardless — make this a required check in branch protection to gate
# merges on it.
#
# `prod` was added for clear #1550: a hotfix branched from `prod` and merged
# straight into `prod` ran no tests and had its "Manual deploy steps" checked by
# nothing, which is the PR most likely to carry a forgotten step and least
# likely to have written it down. Sync PRs into prod are tested here too.

on:
  pull_request:
    branches: [dev, prod]
    # `edited` re-runs the check when the author fills in the PR description's
    # "Manual deploy steps" section.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]

# Cancel a superseded run only for pull_request events. Push-to-dev runs are
# the only verdict a merged commit ever gets (the release is not gated on CI),
# so merges landing back to back must not cancel each other. PR runs share a
# group per PR; push runs get a group per SHA, because GitHub also cancels a
# *pending* run in a group when a third run arrives, regardless of
# cancel-in-progress.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches the Dockerfile's python:3.12-slim
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff, pinned)
        run: uvx ruff@0.16.9 check src tests

      - name: Test
        run: uv run --frozen pytest -q

      # A step the code needs but no code performs must be written down with a
      # prod checkbox and a ticket, or the PR says "None" (clear #1524).
      #
      # Every PR a person writes the body of, into `dev` or into `prod`. The
      # exemption is exactly one PR: THIS repo's dev -> prod sync, whose body is
      # generated by sync-pr-body.yml in its own grammar and whose prod boxes are
      # gated by that workflow's review instead. All three conditions are load
      # bearing -- `head_ref == 'dev'` alone also matches a fork whose own branch
      # is called `dev`, which is a PR a person wrote the body of and which the
      # old `base_ref == 'dev'` form did check. Bot PRs stay exempt because
      # nobody wrote their body. What this adds is the hotfix PR -- branched from
      # `prod`, straight into `prod`, written under time pressure -- which until
      # now was checked by nothing at all (clear #1550).
      #
      # Last in the job, and `!cancelled()`, so a missing section reports its own
      # verdict without suppressing ruff and pytest. On a hotfix that matters:
      # the section is a warning (prod requires no status checks), and a warning
      # must not hide whether the code itself is sound.
      - name: Manual deploy steps section is filled in
        if: >-
          !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.type != 'Bot'
          && !(github.base_ref == 'prod'
          && github.head_ref == 'dev'
          && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --test .github/scripts/check-manual-deploy-steps.test.mjs
          node .github/scripts/check-manual-deploy-steps.mjs
