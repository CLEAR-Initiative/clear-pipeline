name: Build & deploy (dev / staging)

# Push to dev → build → deploy to dev-app (Dagster is co-located with
# clear-api / clear-mvp / clear-pipeline in the same compose stack).
# Reuses the APP_VM_HOST / APP_VM_SSH_KEY environment secrets already
# configured for the sibling repos — one target, one set of credentials.

on:
  push:
    branches: [dev, staging]
  workflow_dispatch: # manual re-deploy without a code change

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name + tags
        id: meta
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_name=${OWNER_LC}/clear-pipeline" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    # `packages: read` lets the run's GITHUB_TOKEN pull the private GHCR image;
    # we pass it into the SSH session and `docker login` there so the deploy no
    # longer depends on a persistent (expirable) `docker login` on the VM.
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name }}
    steps:
      - name: SSH and roll the deployment
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.APP_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.APP_VM_SSH_KEY }}
          envs: GHCR_TOKEN
          # Note: `script_stop` is no longer accepted by @v1 — the same
          # halt-on-error behaviour is provided by `set -e` at the top
          # of the script below, which is the maintainer's recommended
          # replacement.
          # Restart the three Dagster services in a specific order so the
          # webserver + daemon always come up against a fresh code server:
          #   1. Pull the new image (all three services share it).
          #   2. Recreate `dagster-code` first — this is the gRPC user-code
          #      server that both other services talk to.
          #   3. Recreate the daemon so its cached schedule/sensor pointers
          #      re-resolve against the new code server.
          #   4. Recreate the webserver last so UI hits the new gRPC target.
          # `--force-recreate` because compose sometimes skips recreation
          # when only the image SHA changed under a moving tag.
          script: |
            set -e
            # Authenticate to GHCR every deploy — no reliance on a VM-side login
            # that can silently expire (the cause of the `denied` pull error).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /srv/app
            docker compose pull dagster-code dagster-daemon dagster-webserver
            docker compose up -d --force-recreate dagster-code
            docker compose up -d --force-recreate dagster-daemon
            docker compose up -d --force-recreate dagster-webserver
            docker image prune -a -f
            docker compose ps | grep -E 'dagster-'
