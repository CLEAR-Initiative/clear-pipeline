name: CI

# Tests + lint on every PR into dev/staging, and on pushes to them so a red
# dev is visible. Separate from build-and-deploy.yml, which ships on push
# regardless — make this a required check in branch protection to gate
# merges on it.

on:
  pull_request:
    branches: [dev, staging]
  push:
    branches: [dev, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches the Dockerfile's python:3.12-slim
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff, pinned)
        run: uvx ruff@0.16.9 check src tests

      - name: Test
        run: uv run --frozen pytest -q
