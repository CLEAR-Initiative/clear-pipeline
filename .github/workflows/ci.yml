name: CI

# Tests + lint on every PR into dev, and on pushes to dev so a red dev is
# visible. Separate from build-and-deploy.yml, which ships on push
# regardless — make this a required check in branch protection to gate
# merges on it.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# Cancel a superseded run only for pull_request events. Push-to-dev runs are
# the only verdict a merged commit ever gets (the deploy is not gated on CI),
# so two merges landing within a minute must not cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches the Dockerfile's python:3.12-slim
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff, pinned)
        run: uvx ruff@0.16.9 check src tests

      # -n auto: pytest-xdist across the runner's cores. The suite uses in-memory
      # fakes (tests/conftest.py) and no shared DB, so files are independent.
      - name: Test
        run: uv run --frozen pytest -q -n auto
