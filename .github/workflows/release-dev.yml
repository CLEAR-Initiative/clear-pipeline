name: Release / dev
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      skip_data_source_check:
        description: "Build even if a registered data source has no clear-api row. Emergency override only — the missing row still breaks that source's ingest."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Deploy gate (clear #1523) ──────────────────────────────────────────
  # Every source the pipeline ingests resolves its clear-api DataSource id by
  # name, and the row is created by a clear-api migration in another repo on
  # another cadence. When the two disagree the pipeline only finds out inside
  # that source's next scheduled run — which is how the 2026-10-20 `idmc` and
  # 2026-11-13 `iom_dtm_flash_alerts` incidents both stayed hidden for days.
  # So ask before the image exists: a failure here means no new image, and the
  # environment keeps serving the last good one while the rows are added.
  #
  # Deliberately NOT a code-location-load check: raising on import would turn
  # "one source cannot ingest" into "nothing runs and the UI is down", on a
  # clear-api blip as readily as on a real missing row. See the module
  # docstring in src/clear_pipeline/checks/data_sources.py.
  data-sources:
    name: clear-api data_sources rows exist
    # Emergency override, and the only one: a manual run with the input ticked.
    # It is recorded in the run's inputs, so the override is visible forever
    # after — loud, not absolute, like prod's `enforce_admins: false`.
    if: ${{ inputs.skip_data_source_check != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches the Dockerfile's python:3.12-slim
          enable-cache: true

      # The check reads CONNECTORS and GX_SOURCES, which import every provider,
      # so it needs the real environment rather than a trimmed one. ~Minutes on
      # a cold cache; the alternative is shipping code whose rows do not exist.
      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen

      - name: Every registered source has a data_sources row
        env:
          # Public DNS, also set in clear-infrastructure's tfvars. A repo
          # variable overrides it without a code change if the host moves.
          CLEAR_API_URL: ${{ vars.CLEAR_API_URL_DEV || 'https://dev-api.clearinitiative.io/graphql' }}
          CLEAR_API_KEY: ${{ secrets.CLEAR_API_KEY_DEV }}
        run: |
          if [ -z "$CLEAR_API_KEY" ]; then
            echo "::error::CLEAR_API_KEY_DEV is not set, so this deploy gate cannot run. Add it as a repository secret (a clear-api key with the admin or pipeline role)."
            exit 1
          fi
          uv run --frozen python -m clear_pipeline.checks.data_sources

  # The version tag used to be its own job: ~6 s of work billed as a full
  # minute plus a checkout and a scheduling hop on the merge-to-live path.
  # It now runs at the top of the build job, still strictly before the image
  # is built so the tag and the image version never disagree.
  build:
    name: Build & push image
    needs: data-sources
    # `always()` because a skipped `needs` would otherwise skip this job too,
    # and the gate skips itself when the override input is ticked. The explicit
    # result check keeps a *failed* gate blocking: only success-or-override
    # builds.
    if: ${{ always() && (needs.data-sources.result == 'success' || inputs.skip_data_source_check == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Idempotent: a re-run of a failed build reuses the version tag this
      # commit already has instead of allocating the next one and leaving the
      # previous tag without an image.
      - name: Compute version
        id: version
        run: |
          TAGS=$(git ls-remote --tags --refs origin)
          EXISTING=$(echo "$TAGS" | awk -v sha="$GITHUB_SHA" '$1 == sha { sub(".*/", "", $2); print $2 }' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$EXISTING" ]; then
            echo "Reusing existing tag $EXISTING for $GITHUB_SHA"
            echo "version=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(echo "$TAGS" | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
          # dev deploys bump the MINOR within the current prod MAJOR; a prod
          # deploy bumps the MAJOR (release-prod.yml). The two never
          # pick the same next version, so they can't contend for a tag.
          echo "version=${MAJOR}.$((MINOR + 1)).0" >> "$GITHUB_OUTPUT"
          echo "existing=false" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.version.outputs.existing != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - uses: ./.github/actions/build-image
        with:
          environment: ${{ github.ref_name }}
          version: ${{ steps.version.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
