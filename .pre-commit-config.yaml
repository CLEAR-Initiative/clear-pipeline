# Local secret-scanning hook. Enable it once per clone:
#   uvx pre-commit install        (or: pip install pre-commit && pre-commit install)
#
# gitleaks runs `protect --staged` on every commit and blocks it if a secret is
# found. This is the fast local layer; CI (.github/workflows/gitleaks.yml) and
# GitHub push-protection enforce it where a local hook can be bypassed.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
