[project]
name = "clear_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.11",
    # dagster-webserver + dagster-postgres MUST live in main deps (not
    # the dev group) because the deployed image runs `dagster-webserver`
    # and needs `dagster_postgres.run_storage.PostgresRunStorage` at
    # instance boot for the postgres-backed run / event-log / schedule
    # storage. `uv pip install .` in the Dockerfile installs main deps
    # only — putting these in the dev group would fail the container
    # on start with either "webserver: command not found" or
    # "Couldn't import module dagster_postgres.run_storage".
    "dagster-webserver",
    "dagster-postgres",
    "requests>=2.32",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    # Knowledge-base pipeline dependencies. Kept minimal + provider-agnostic
    # so the OSS swap (Voyage → BGE-M3, Claude → Llama) is a config change.
    "anthropic>=0.40", # native SDK — used for prompt caching in the contextualization step
    "openai>=1.55", # OpenAI-compatible client — reused for Together / Fireworks / vLLM / TEI
    "voyageai>=0.3", # Voyage embeddings SDK (v1 default)
    "pydantic>=2.9", # structured-output validation shared across providers
    "tenacity>=9.0", # retry with exponential backoff on transient provider errors
    "pdfplumber>=0.11", # pure-Python PDF text extraction (better layout preservation than pypdf)
    "tiktoken>=0.8", # chunk-size proxy tokenizer — approximate but stable across providers
    "httpx>=0.27", # GraphQL client for clear-api — all DB access routes through the API,
    # matching clear-pipeline's pattern (no direct psycopg writes from Dagster)
    "pypdf>=4", # lighter fallback extractor when pdfplumber OOMs on graphics-dense PDFs
    # ── Signal pipeline (ported from clear-pipeline, Celery→Dagster consolidation) ──
    "pydantic-settings>=2.7", # the ported signal domain's config (src.config → signals.config)
    "redis>=5.0", # dedup locks, classification cache, watermarks (signal drain)
    "sentence-transformers>=3.0", # local event classifier / grouping
    # Direct (not just transitive via sentence-transformers) so the CPU-index
    # override in [tool.uv.sources] applies — see the note at the end of the file.
    "torch>=2.13",
    "rapidfuzz>=3.10", # lexical event grouping
    "rasterio>=1.3", # population raster reads (populationAffected)
    "shapely>=2.0", # geometry ops for population + grouping
    "numpy>=1.26", # raster/vector math
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
# Truly-local-only tooling. `dagster-dg-cli` is used by the `dg dev`
# workflow when iterating on the pipeline on a laptop; it is NOT needed
# in the deployed image. `pytest` speaks for itself.
dev = [
    "dagster-dg-cli",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `src/` layout — hatchling's default wheel discovery looks for a
# top-level directory matching `project.name` (i.e. `./clear_pipeline`),
# which doesn't exist here (source lives under `./src/clear_pipeline`).
# Without this, `uv pip install .` produces a wheel with no Python code
# and the deployed image fails with "No module named 'clear_pipeline'"
# when Dagster's gRPC server tries `-m clear_pipeline.definitions`.
[tool.hatch.build.targets.wheel]
packages = ["src/clear_pipeline"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "clear_pipeline"
registry_modules = [
    "clear_pipeline.components.*",
]



# CPU-only torch. sentence-transformers pulls torch transitively, and the default
# Linux build declares the full CUDA stack (cuda-toolkit: cupti, cublas, cudart,
# … — several GB). That bloats the image and overflows the deploy host's disk on
# layer extraction ("no space left on device"). The CPU wheel has none of it and
# the classifier runs on CPU anyway. Route torch to PyTorch's CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Linux only: that's where the default build declares the CUDA stack (and where
# the deploy runs). On macOS the PyPI wheel is already CPU/MPS with no CUDA, and
# there's no `+cpu` variant, so leave it on PyPI there.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
