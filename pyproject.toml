[project]
name = "clear_context_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.11",
    "requests>=2.32",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    # Knowledge-base pipeline dependencies. Kept minimal + provider-agnostic
    # so the OSS swap (Voyage → BGE-M3, Claude → Llama) is a config change.
    "anthropic>=0.40",       # native SDK — used for prompt caching in the contextualization step
    "openai>=1.55",          # OpenAI-compatible client — reused for Together / Fireworks / vLLM / TEI
    "voyageai>=0.3",         # Voyage embeddings SDK (v1 default)
    "pydantic>=2.9",         # structured-output validation shared across providers
    "tenacity>=9.0",         # retry with exponential backoff on transient provider errors
    "pdfplumber>=0.11",      # pure-Python PDF text extraction (better layout preservation than pypdf)
    "tiktoken>=0.8",         # chunk-size proxy tokenizer — approximate but stable across providers
    "httpx>=0.27",            # GraphQL client for clear-api — all DB access routes through the API,
                              # matching clear-pipeline's pattern (no direct psycopg writes from Dagster)
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "clear_context_pipeline"
registry_modules = [
    "clear_context_pipeline.components.*",
]


